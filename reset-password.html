<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تغییر پسورد | PO-TRADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#03040a;color:#eef3ff;font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px;overflow-x:hidden;position:relative}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(90px);opacity:.5;animation:orbFloat 20s ease-in-out infinite}
.orb-a{width:520px;height:520px;background:radial-gradient(circle,#2ee6a6 0%,transparent 70%);top:-200px;right:-160px}
.orb-b{width:560px;height:560px;background:radial-gradient(circle,#5b8cff 0%,transparent 70%);bottom:-240px;left:-180px;animation-delay:-7s}
.orb-c{width:420px;height:420px;background:radial-gradient(circle,#ff5fa2 0%,transparent 70%);top:35%;left:45%;opacity:.25;animation-delay:-13s}
@keyframes orbFloat{0%,100%{transform:translate3d(0,0,0) scale(1)}33%{transform:translate3d(30px,-20px,0) scale(1.08)}66%{transform:translate3d(-20px,30px,0) scale(.94)}}
.card{position:relative;z-index:1;width:100%;max-width:460px;background:linear-gradient(160deg,rgba(20,29,51,.85),rgba(15,23,42,.95));border:1px solid rgba(120,150,200,.2);border-radius:28px;padding:40px 34px 34px;backdrop-filter:blur(30px);box-shadow:0 50px 100px -30px rgba(0,0,0,.95);text-align:center;animation:cardIn .8s cubic-bezier(.2,.9,.3,1.1) both}
@keyframes cardIn{from{opacity:0;transform:translateY(30px) scale(.94)}to{opacity:1;transform:none}}
.card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2ee6a6,#5b8cff,#c78aff,#ff5fa2);border-radius:28px 28px 0 0}
.icon-wrap{position:relative;display:inline-block;margin-bottom:22px}
.icon{position:relative;z-index:2;width:88px;height:88px;border-radius:26px;display:grid;place-items:center;font-size:42px;background:linear-gradient(135deg,rgba(46,230,166,.2),rgba(91,140,255,.2));border:1.5px solid rgba(46,230,166,.4);animation:iconBounce 3s ease-in-out infinite}
@keyframes iconBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.icon-wrap::before{content:'';position:absolute;inset:-14px;border-radius:50%;background:conic-gradient(from 0deg,transparent 0deg,#2ee6a6 90deg,transparent 180deg,#5b8cff 270deg,transparent 360deg);animation:spin 4s linear infinite;filter:blur(10px);opacity:.7}
@keyframes spin{to{transform:rotate(360deg)}}
h1{font-size:23px;font-weight:900;margin-bottom:10px;background:linear-gradient(90deg,#eef3ff,#2ee6a6 60%,#5b8cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
p{font-size:13.5px;color:#8697b8;line-height:1.8;margin-bottom:8px;text-align:center}
.email-box{display:inline-block;padding:9px 16px;border-radius:12px;background:rgba(46,230,166,.1);border:1px solid rgba(46,230,166,.3);color:#2ee6a6;font-family:monospace;font-size:12.5px;margin:12px 0 22px;direction:ltr;word-break:break-all;max-width:100%}
.field{display:flex;flex-direction:column;gap:8px;text-align:right;margin-bottom:14px}
.field label{font-size:12.5px;font-weight:700;color:#c7d3ea}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .ico{position:absolute;right:16px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}
input[type=password]{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(120,150,200,.2);color:#eef3ff;font:inherit;font-size:14.5px;padding:15px 46px;border-radius:14px;outline:none;transition:all .3s;font-family:inherit}
input[type=password]:focus{border-color:rgba(46,230,166,.7);background:rgba(46,230,166,.06);box-shadow:0 0 0 4px rgba(46,230,166,.15)}
input::placeholder{color:#6a7a95;opacity:.7}
.toggle-pass{position:absolute;left:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border:0;background:transparent;color:#8697b8;font-size:15px;cursor:pointer;border-radius:10px;display:grid;place-items:center}
.pass-meter{margin-top:10px}
.pass-meter-bar{height:5px;background:rgba(120,150,200,.12);border-radius:5px;overflow:hidden;display:flex;gap:3px}
.pass-meter-bar span{flex:1;height:100%;background:rgba(120,150,200,.15);border-radius:3px;transition:all .3s}
.pass-meter-bar span.on-weak{background:linear-gradient(90deg,#ff5674,#ff8fa3)}
.pass-meter-bar span.on-medium{background:linear-gradient(90deg,#ffb020,#ffd97a)}
.pass-meter-bar span.on-strong{background:linear-gradient(90deg,#2ee6a6,#7bffd0)}
.pass-meter-label{margin-top:6px;font-size:11px;font-weight:700;color:#6a7a95;direction:ltr;text-align:left}
.pass-meter-label.weak{color:#ff95a8}
.pass-meter-label.medium{color:#ffd97a}
.pass-meter-label.strong{color:#2ee6a6}
.pass-rules{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:10px}
.pass-rule{display:flex;align-items:center;gap:6px;font-size:10.5px;color:#6a7a95;font-weight:600}
.pass-rule .dot{width:14px;height:14px;border-radius:50%;border:1.5px solid rgba(120,150,200,.3);display:grid;place-items:center;font-size:9px;color:transparent;transition:all .25s;flex:0 0 14px}
.pass-rule.ok{color:#2ee6a6}
.pass-rule.ok .dot{background:rgba(46,230,166,.15);border-color:#2ee6a6;color:#2ee6a6}
.pass-rule.bad{color:#ff95a8}
.pass-rule.bad .dot{background:rgba(255,86,116,.15);border-color:#ff5674;color:#ff5674}
.msg{font-size:12.5px;font-weight:700;border-radius:13px;padding:12px 15px;display:none;align-items:center;gap:10px;margin-bottom:14px;text-align:right}
.msg.show{display:flex}
.msg.err{color:#ff95a8;background:rgba(255,86,116,.1);border:1px solid rgba(255,86,116,.3)}
.msg.ok{color:#a0e0b0;background:rgba(46,230,166,.1);border:1px solid rgba(46,230,166,.3)}
.btn{width:100%;padding:16px;border-radius:15px;border:0;background:linear-gradient(135deg,#2ee6a6,#12b57f);color:#04170f;font:inherit;font-size:14.5px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:all .25s;box-shadow:0 15px 40px -12px rgba(46,230,166,.7)}
.btn:hover:not(:disabled){transform:translateY(-2px)}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.btn .spinner{width:18px;height:18px;border:2.5px solid rgba(4,23,15,.25);border-top-color:#04170f;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn.loading .spinner{display:block}
.btn.loading span:last-child{opacity:.7}
.status{display:flex;align-items:center;justify-content:center;gap:10px;padding:14px 18px;border-radius:14px;font-size:13px;font-weight:700;margin-bottom:18px}
.status.loading{background:rgba(91,140,255,.1);color:#93b2ff;border:1px solid rgba(91,140,255,.3)}
.status.error{background:rgba(255,86,116,.1);color:#ff95a8;border:1px solid rgba(255,86,116,.3)}
.spinner{width:16px;height:16px;border:2.5px solid rgba(91,140,255,.25);border-top-color:#93b2ff;border-radius:50%;animation:spin .7s linear infinite}
.hidden{display:none!important}
.link-btn{background:none;border:0;color:#2ee6a6;font:inherit;font-weight:700;cursor:pointer;text-decoration:underline;margin-top:14px;font-size:13px}
</style>
</head>
<body>

<div class="bg">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
</div>

<div class="card">
  <div class="icon-wrap"><div class="icon" id="icon">🔐</div></div>
  <h1 id="title">در حال بررسی لینک…</h1>
  <p id="subtitle">لطفاً کمی صبر کن</p>
  <div class="email-box" id="emailBox" style="display:none"></div>

  <div class="status loading" id="status">
    <span class="spinner"></span>
    <span id="statusText">در حال بررسی…</span>
  </div>

  <form id="resetForm" class="hidden">
    <div class="field">
      <label>🔐 پسورد جدید</label>
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input type="password" id="newPass" placeholder="حداقل ۸ کاراکتر" required autocomplete="new-password">
        <button type="button" class="toggle-pass" data-target="newPass">👁️</button>
      </div>
      <div class="pass-meter" id="passMeter" style="display:none">
        <div class="pass-meter-bar">
          <span id="pm1"></span><span id="pm2"></span><span id="pm3"></span><span id="pm4"></span><span id="pm5"></span>
        </div>
        <div class="pass-meter-label" id="passLabel">—</div>
      </div>
      <div class="pass-rules" id="passRules" style="display:none">
        <div class="pass-rule" data-rule="length"><span class="dot">✓</span><span>حداقل ۸ کاراکتر</span></div>
        <div class="pass-rule" data-rule="lower"><span class="dot">✓</span><span>حرف کوچک</span></div>
        <div class="pass-rule" data-rule="upper"><span class="dot">✓</span><span>حرف بزرگ</span></div>
        <div class="pass-rule" data-rule="number"><span class="dot">✓</span><span>عدد</span></div>
        <div class="pass-rule" data-rule="special"><span class="dot">✓</span><span>علامت خاص</span></div>
      </div>
    </div>

    <div class="field">
      <label>🔁 تکرار پسورد جدید</label>
      <div class="input-wrap">
        <span class="ico">🔒</span>
        <input type="password" id="newPass2" placeholder="دوباره وارد کن" required autocomplete="new-password">
      </div>
    </div>

    <div class="msg err" id="errMsg"><span>⚠️</span><span id="errMsgText"></span></div>
    <div class="msg ok" id="okMsg"><span>✅</span><span id="okMsgText"></span></div>

    <button type="submit" class="btn" id="btnSave">
      <span class="spinner"></span>
      <span>💾 ذخیره پسورد جدید</span>
    </button>
  </form>

  <button class="link-btn hidden" id="backBtn" onclick="location.href='auth.html'">بازگشت به صفحه ورود</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://rodguhcuatixdbzwjfvy.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGd1aGN1YXRpeGRiendqZnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTgyMTMsImV4cCI6MjEwNTQ5NDIxM30.oXGyCA3jOcsS5inqsXuSOhELZLoUG7pYagZox1SEmhY';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function setStatus(type, text, icon){
  const s = $('status');
  if (type === 'hidden') { s.classList.add('hidden'); return; }
  s.className = 'status ' + type;
  s.classList.remove('hidden');
  $('statusText').textContent = text;
  if (icon) $('icon').textContent = icon;
}
function showErr(m){
  $('errMsgText').textContent = m;
  $('errMsg').classList.add('show');
  $('okMsg').classList.remove('show');
}
function showOk(m){
  $('okMsgText').textContent = m;
  $('okMsg').classList.add('show');
  $('errMsg').classList.remove('show');
}

(function(){
  const hash = window.location.hash.substring(1);
  const params = new URLSearchParams(hash);
  if (params.get('error_code') === 'otp_expired') {
    setStatus('error', 'لینک بازیابی منقضی شده. لطفاً از صفحه ورود دوباره درخواست بده.', '⏰');
    $('title').textContent = 'لینک منقضی شده';
    $('subtitle').textContent = 'این لینک قبلاً استفاده شده یا منقضی شده.';
    $('backBtn').classList.remove('hidden');
    window.history.replaceState(null, '', window.location.pathname);
  }
})();

(async function(){
  try {
    const { data: { session }, error } = await sb.auth.getSession();
    if (error) throw error;

    if (session && session.user) {
      activateForm(session.user.email);
    } else {
      let attempts = 0;
      const check = setInterval(async () => {
        attempts++;
        const { data } = await sb.auth.getSession();
        if (data && data.session && data.session.user) {
          clearInterval(check);
          activateForm(data.session.user.email);
        } else if (attempts >= 12) {
          clearInterval(check);
          setStatus('error', 'لینک نامعتبره. دوباره درخواست بده.', '❌');
          $('title').textContent = 'لینک نامعتبر';
          $('subtitle').textContent = 'این لینک منقضی شده یا قبلاً استفاده شده.';
          $('backBtn').classList.remove('hidden');
        }
      }, 500);
    }
  } catch (err) {
    setStatus('error', 'خطا: ' + err.message, '❌');
    $('backBtn').classList.remove('hidden');
  }
})();

function activateForm(email){
  $('title').textContent = '🔐 پسورد جدید رو وارد کن';
  $('subtitle').textContent = 'یه پسورد قوی انتخاب کن';
  $('emailBox').style.display = 'inline-block';
  $('emailBox').textContent = email || '';
  setStatus('hidden');
  $('resetForm').classList.remove('hidden');
  setTimeout(() => $('newPass').focus(), 300);
}

document.querySelectorAll('.toggle-pass').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = $(btn.dataset.target);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  });
});

function checkPassword(pass){
  return {
    length: pass.length >= 8,
    lower: /[a-z]/.test(pass),
    upper: /[A-Z]/.test(pass),
    number: /[0-9]/.test(pass),
    special: /[^A-Za-z0-9]/.test(pass)
  };
}
function renderStrength(pass){
  const meter = $('passMeter');
  const rules = $('passRules');
  const label = $('passLabel');
  if (!pass) {
    meter.style.display = 'none';
    rules.style.display = 'none';
    return;
  }
  meter.style.display = '';
  rules.style.display = '';
  const c = checkPassword(pass);
  const score = Object.values(c).filter(Boolean).length;
  const segs = [$('pm1'),$('pm2'),$('pm3'),$('pm4'),$('pm5')];
  segs.forEach(s => s.className = '');
  let level = 'weak';
  let onCls = 'on-weak';
  if (score >= 5 && pass.length >= 10) { level = 'strong'; onCls = 'on-strong'; }
  else if (score >= 3) { level = 'medium'; onCls = 'on-medium'; }
  const fillCount = level === 'strong' ? 5 : level === 'medium' ? 3 : Math.max(1, score);
  for (let i = 0; i < fillCount; i++) segs[i].className = onCls;
  label.className = 'pass-meter-label ' + level;
  label.textContent = level === 'strong' ? '💪 قوی' : level === 'medium' ? '⚠️ متوسط' : '🔴 ضعیف';
  document.querySelectorAll('.pass-rule').forEach(el => {
    const k = el.dataset.rule;
    const ok = c[k];
    el.classList.toggle('ok', ok);
    el.classList.toggle('bad', pass.length > 0 && !ok);
  });
}
$('newPass').addEventListener('input', e => renderStrength(e.target.value));

$('resetForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const pass = $('newPass').value;
  const pass2 = $('newPass2').value;

  const c = checkPassword(pass);
  const missing = [];
  if (!c.length) missing.push('۸ کاراکتر');
  if (!c.lower) missing.push('حرف کوچک');
  if (!c.upper) missing.push('حرف بزرگ');
  if (!c.number) missing.push('عدد');
  if (!c.special) missing.push('علامت خاص');
  if (missing.length) return showErr('پسورد ضعیفه — این‌ها لازمه: ' + missing.join('، '));
  if (pass !== pass2) return showErr('پسوردها یکسان نیستند');

  const btn = $('btnSave');
  btn.classList.add('loading');
  btn.disabled = true;

  try {
    const { error } = await sb.auth.updateUser({ password: pass });
    if (error) throw error;
    showOk('✅ پسورد تغییر کرد! در حال انتقال…');
    setTimeout(() => location.replace('index.html'), 1500);
  } catch (err) {
    btn.classList.remove('loading');
    btn.disabled = false;
    showErr(mapError(err.message));
  }
});

function mapError(msg){
  const m = {
    'New password should be different from the old password': 'پسورد جدید باید متفاوت از قبلی باشه',
    'Password should be at least 6 characters': 'پسورد باید حداقل ۶ کاراکتر باشه',
    'Auth session missing': 'لینک منقضی شده — دوباره درخواست بده',
    'User not found': 'کاربر پیدا نشد'
  };
  for (const k in m) if (msg && msg.includes(k)) return m[k];
  return msg || 'خطا رخ داد';
}
</script>
</body>
</html>
