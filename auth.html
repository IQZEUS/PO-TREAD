<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ورود | PO-TRADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:#05070f;color:#eef3ff;font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;min-height:100vh;display:grid;place-items:center;padding:20px}
.bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none}
.orb{position:absolute;border-radius:50%;filter:blur(100px);opacity:.45;animation:float 22s ease-in-out infinite}
.orb-a{width:460px;height:460px;background:radial-gradient(circle,#2ee6a6 0%,transparent 70%);top:-160px;right:-140px}
.orb-b{width:500px;height:500px;background:radial-gradient(circle,#5b8cff 0%,transparent 70%);bottom:-200px;left:-160px;animation-delay:-7s}
.orb-c{width:380px;height:380px;background:radial-gradient(circle,#ff5fa2 0%,transparent 70%);top:30%;left:40%;opacity:.22;animation-delay:-13s}
@keyframes float{0%,100%{transform:translate3d(0,0,0)}33%{transform:translate3d(30px,-20px,0)}66%{transform:translate3d(-20px,20px,0)}}
.auth-wrap{position:relative;z-index:1;width:100%;max-width:440px}
.auth-card{background:linear-gradient(160deg,rgba(20,29,51,.85),rgba(15,23,42,.95));border:1px solid rgba(120,150,200,.18);border-radius:26px;padding:36px 32px 30px;backdrop-filter:blur(26px);box-shadow:0 40px 90px -30px rgba(0,0,0,.9);position:relative;overflow:hidden}
.auth-card::before{content:'';position:absolute;top:0;left:0;right:0;height:4px;background:linear-gradient(90deg,#2ee6a6,#5b8cff,#ff5fa2);border-radius:26px 26px 0 0}
.brand{display:flex;flex-direction:column;align-items:center;gap:12px;margin-bottom:24px}
.brand-logo{width:68px;height:68px;display:grid;place-items:center;border-radius:20px;font-size:32px;background:linear-gradient(135deg,rgba(46,230,166,.2),rgba(91,140,255,.2));border:1.5px solid rgba(46,230,166,.4)}
.brand-title{font-size:24px;font-weight:900;background:linear-gradient(90deg,#eef3ff,#2ee6a6 60%,#5b8cff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;direction:ltr}
.brand-sub{font-size:12px;color:#8697b8}
.tabs{display:flex;gap:4px;padding:4px;background:rgba(255,255,255,.03);border:1px solid rgba(120,150,200,.14);border-radius:14px;margin-bottom:20px}
.tab-btn{flex:1;padding:11px;border-radius:10px;border:0;background:transparent;color:#8697b8;font:inherit;font-size:13px;font-weight:800;cursor:pointer}
.tab-btn.active{background:linear-gradient(135deg,rgba(46,230,166,.2),rgba(91,140,255,.15));color:#eef3ff}
.form{display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;font-weight:700;color:#c7d3ea}
.input-wrap{position:relative;display:flex;align-items:center}
.input-wrap .ico{position:absolute;right:15px;top:50%;transform:translateY(-50%);font-size:15px;opacity:.55}
input[type=email],input[type=password]{width:100%;background:rgba(255,255,255,.04);border:1.5px solid rgba(120,150,200,.2);color:#eef3ff;font:inherit;font-size:14.5px;padding:14px 44px;border-radius:13px;outline:none;font-family:inherit}
input[type=email]{direction:ltr}
input:focus{border-color:rgba(46,230,166,.6);background:rgba(46,230,166,.06);box-shadow:0 0 0 4px rgba(46,230,166,.15)}
.toggle-pass{position:absolute;left:7px;top:50%;transform:translateY(-50%);width:36px;height:36px;border:0;background:transparent;color:#8697b8;font-size:14px;cursor:pointer;border-radius:9px}
.msg{font-size:12.5px;font-weight:700;border-radius:11px;padding:11px 14px;display:none;align-items:center;gap:9px}
.msg.show{display:flex}
.msg.err{color:#ff95a8;background:rgba(255,86,116,.1);border:1px solid rgba(255,86,116,.25)}
.msg.ok{color:#a0e0b0;background:rgba(46,230,166,.1);border:1px solid rgba(46,230,166,.25)}
.btn-submit{width:100%;padding:15px;border-radius:13px;border:0;background:linear-gradient(135deg,#2ee6a6,#12b57f);color:#04170f;font:inherit;font-size:14.5px;font-weight:900;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.btn-submit:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 22px 50px -14px rgba(46,230,166,.9)}
.btn-submit:disabled{opacity:.75;cursor:not-allowed}
.btn-submit .spinner{width:18px;height:18px;border:2.5px solid rgba(4,23,15,.25);border-top-color:#04170f;border-radius:50%;animation:spin .7s linear infinite;display:none}
.btn-submit.loading .spinner{display:block}
@keyframes spin{to{transform:rotate(360deg)}}
.btn-google{width:100%;padding:13px;border-radius:13px;border:1.5px solid rgba(120,150,200,.2);background:rgba(255,255,255,.03);color:#eef3ff;font:inherit;font-size:13.5px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px;transition:.2s}
.btn-google:hover{background:rgba(255,255,255,.06)}
.divider{display:flex;align-items:center;gap:12px;color:#6a7a95;font-size:11.5px}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:rgba(120,150,200,.15)}
.foot{text-align:center;margin-top:16px;font-size:11.5px;color:#6a7a95}
.foot a{color:#2ee6a6;text-decoration:none;font-weight:700;cursor:pointer}
.splash{position:fixed;inset:0;z-index:9999;background:#05070f;display:grid;place-items:center;opacity:0;pointer-events:none;transition:opacity .35s}
.splash.show{opacity:1;pointer-events:auto}
.splash-inner{display:flex;flex-direction:column;align-items:center;gap:18px}
.splash-logo{width:60px;height:60px;border-radius:18px;display:grid;place-items:center;font-size:28px;background:linear-gradient(135deg,rgba(46,230,166,.2),rgba(91,140,255,.2));border:1.5px solid rgba(46,230,166,.4)}
.splash-text{font-size:13px;color:#8697b8}
</style>
</head>
<body>

<div class="bg">
  <span class="orb orb-a"></span>
  <span class="orb orb-b"></span>
  <span class="orb orb-c"></span>
</div>

<div class="auth-wrap">
  <div class="auth-card">
    <div class="brand">
      <div class="brand-logo">📈</div>
      <div class="brand-title">PO-TRADE</div>
      <div class="brand-sub">ژورنال معاملات — ثبت‌نام کن یا وارد شو</div>
    </div>

    <div class="tabs">
      <button class="tab-btn active" id="tabLogin" type="button">ورود</button>
      <button class="tab-btn" id="tabSignup" type="button">ثبت‌نام</button>
    </div>

    <form class="form" id="loginForm">
      <div class="field">
        <label>📧 ایمیل</label>
        <div class="input-wrap">
          <span class="ico">✉️</span>
          <input type="email" id="loginEmail" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="field">
        <label>🔐 رمز عبور</label>
        <div class="input-wrap">
          <span class="ico">🔒</span>
          <input type="password" id="loginPassword" placeholder="••••••••" required>
          <button type="button" class="toggle-pass" data-target="loginPassword">👁️</button>
        </div>
      </div>
      <div class="msg err" id="loginMsg"><span>⚠️</span><span id="loginMsgText"></span></div>
      <div class="msg ok" id="loginOk"><span>✅</span><span id="loginOkText"></span></div>
      <button type="submit" class="btn-submit" id="btnLogin"><span class="spinner"></span><span>🚀 ورود</span></button>
      <div class="divider">یا</div>
      <button type="button" class="btn-google" id="btnGoogle">🔵 ورود با گوگل</button>
      <div class="foot"><a id="forgotPass">رمزت رو فراموش کردی؟</a></div>
    </form>

    <form class="form" id="signupForm" style="display:none">
      <div class="field">
        <label>📧 ایمیل</label>
        <div class="input-wrap">
          <span class="ico">✉️</span>
          <input type="email" id="signupEmail" placeholder="you@example.com" required>
        </div>
      </div>
      <div class="field">
        <label>🔐 رمز عبور</label>
        <div class="input-wrap">
          <span class="ico">🔒</span>
          <input type="password" id="signupPassword" placeholder="حداقل ۶ کاراکتر" required>
          <button type="button" class="toggle-pass" data-target="signupPassword">👁️</button>
        </div>
      </div>
      <div class="field">
        <label>🔁 تکرار رمز عبور</label>
        <div class="input-wrap">
          <span class="ico">🔒</span>
          <input type="password" id="signupPassword2" placeholder="دوباره وارد کن" required>
        </div>
      </div>
      <div class="msg err" id="signupMsg"><span>⚠️</span><span id="signupMsgText"></span></div>
      <div class="msg ok" id="signupOk"><span>✅</span><span id="signupOkText"></span></div>
      <button type="submit" class="btn-submit" id="btnSignup"><span class="spinner"></span><span>✨ ساخت حساب</span></button>
      <div class="divider">یا</div>
      <button type="button" class="btn-google" id="btnGoogleSignup">🔵 ثبت‌نام با گوگل</button>
    </form>
  </div>
</div>

<div class="splash" id="splash">
  <div class="splash-inner">
    <div class="splash-logo">📈</div>
    <div class="splash-text">در حال ورود…</div>
  </div>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, sendPasswordResetEmail, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, updateProfile } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyCRZyYSsvy4gw4fYAkP0Moj0OoPpexOYlY",
  authDomain: "po-trad.firebaseapp.com",
  projectId: "po-trad",
  storageBucket: "po-trad.firebasestorage.app",
  messagingSenderId: "843892172342",
  appId: "1:843892172342:web:1c550ac62cfa1570161a97"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const googleProvider = new GoogleAuthProvider();
const $ = id => document.getElementById(id);

function showErr(f, m){ $('loginMsg') && $('loginMsgText'); $((f==='login'?'loginMsgText':'signupMsgText')).textContent=m; $((f==='login'?'loginMsg':'signupMsg')).classList.add('show'); setTimeout(()=>$(f==='login'?'loginMsg':'signupMsg').classList.remove('show'),5000); }
function showOk(f, m){ $((f==='login'?'loginOkText':'signupOkText')).textContent=m; $((f==='login'?'loginOk':'signupOk')).classList.add('show'); }

$('tabLogin').addEventListener('click', () => { $('tabLogin').classList.add('active'); $('tabSignup').classList.remove('active'); $('loginForm').style.display=''; $('signupForm').style.display='none'; });
$('tabSignup').addEventListener('click', () => { $('tabSignup').classList.add('active'); $('tabLogin').classList.remove('active'); $('signupForm').style.display=''; $('loginForm').style.display='none'; });

document.querySelectorAll('.toggle-pass').forEach(btn => {
  btn.addEventListener('click', () => {
    const inp = $(btn.dataset.target);
    inp.type = inp.type === 'password' ? 'text' : 'password';
    btn.textContent = inp.type === 'password' ? '👁️' : '🙈';
  });
});

$('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('loginEmail').value.trim(), pass = $('loginPassword').value;
  if (!email || !pass) return showErr('login','ایمیل و رمز عبور را وارد کن');
  const btn = $('btnLogin'); btn.classList.add('loading'); btn.disabled = true;
  try {
    await signInWithEmailAndPassword(auth, email, pass);
    $('splash').classList.add('show');
    setTimeout(() => window.location.href = 'INDEX.html', 700);
  } catch (err) { btn.classList.remove('loading'); btn.disabled = false; showErr('login', mapError(err.code)); }
});

$('signupForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = $('signupEmail').value.trim(), pass = $('signupPassword').value, pass2 = $('signupPassword2').value;
  if (!email || !pass) return showErr('signup','ایمیل و رمز عبور را وارد کن');
  if (pass.length < 6) return showErr('signup','رمز باید حداقل ۶ کاراکتر باشه');
  if (pass !== pass2) return showErr('signup','رمزها یکسان نیستند');
  const btn = $('btnSignup'); btn.classList.add('loading'); btn.disabled = true;
  try {
    const cred = await createUserWithEmailAndPassword(auth, email, pass);
    try { await updateProfile(cred.user, { displayName: email.split('@')[0] }); } catch(e){}
    showOk('signup','حساب ساخته شد! در حال ورود…');
    setTimeout(() => { $('splash').classList.add('show'); setTimeout(() => window.location.href='INDEX.html', 700); }, 1000);
  } catch (err) { btn.classList.remove('loading'); btn.disabled = false; showErr('signup', mapError(err.code)); }
});

$('btnGoogle').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); $('splash').classList.add('show'); setTimeout(() => window.location.href='INDEX.html', 700); }
  catch (err) { showErr('login', mapError(err.code)); }
});
$('btnGoogleSignup').addEventListener('click', async () => {
  try { await signInWithPopup(auth, googleProvider); $('splash').classList.add('show'); setTimeout(() => window.location.href='INDEX.html', 700); }
  catch (err) { showErr('signup', mapError(err.code)); }
});

$('forgotPass').addEventListener('click', async () => {
  const email = $('loginEmail').value.trim();
  if (!email) return showErr('login','اول ایمیلت رو وارد کن');
  try { await sendPasswordResetEmail(auth, email); showOk('login','ایمیل بازیابی ارسال شد ✅'); }
  catch (err) { showErr('login', mapError(err.code)); }
});

onAuthStateChanged(auth, user => {
  if (user) { $('splash').classList.add('show'); setTimeout(() => window.location.href='INDEX.html', 400); }
});

function mapError(code){
  const m = {
    'auth/invalid-email':'ایمیل نامعتبره',
    'auth/user-not-found':'کاربری با این ایمیل پیدا نشد',
    'auth/wrong-password':'رمز عبور اشتباهه',
    'auth/invalid-credential':'ایمیل یا رمز عبور اشتباهه',
    'auth/email-already-in-use':'این ایمیل قبلاً ثبت شده',
    'auth/weak-password':'رمز عبور ضعیفه (حداقل ۶ کاراکتر)',
    'auth/too-many-requests':'تلاش زیاد. کمی بعد امتحان کن',
    'auth/popup-closed-by-user':'پنجره گوگل بسته شد',
    'auth/unauthorized-domain':'این دامنه توی Firebase مجاز نیست'
  };
  return m[code] || 'خطا: ' + code;
}
</script>
</body>
</html>
