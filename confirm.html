<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>تأیید ایمیل | PO-TRADE</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800;900&display=swap');

*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}

body{
  background:#03040a;
  color:#eef3ff;
  font-family:'Vazirmatn',system-ui,Tahoma,sans-serif;
  min-height:100vh;
  display:grid;
  place-items:center;
  padding:20px;
  position:relative;
  overflow-x:hidden;
}

/* ============ BACKGROUND ============ */
.bg{
  position:fixed;inset:0;z-index:0;
  overflow:hidden;pointer-events:none;
}
.orb{
  position:absolute;border-radius:50%;
  filter:blur(100px);
  opacity:.55;
  animation:orbFloat 22s ease-in-out infinite;
  will-change:transform;
}
.orb-a{
  width:520px;height:520px;
  background:radial-gradient(circle,#2ee6a6 0%,transparent 70%);
  top:-180px;right:-140px;
}
.orb-b{
  width:560px;height:560px;
  background:radial-gradient(circle,#5b8cff 0%,transparent 70%);
  bottom:-220px;left:-160px;
  animation-delay:-7s;
}
.orb-c{
  width:420px;height:420px;
  background:radial-gradient(circle,#ff5fa2 0%,transparent 70%);
  top:40%;left:50%;
  opacity:.25;
  animation-delay:-13s;
}
.orb-d{
  width:380px;height:380px;
  background:radial-gradient(circle,#c78aff 0%,transparent 70%);
  bottom:10%;right:10%;
  opacity:.2;
  animation-delay:-5s;
}
@keyframes orbFloat{
  0%,100%{transform:translate3d(0,0,0) scale(1)}
  33%{transform:translate3d(40px,-30px,0) scale(1.08)}
  66%{transform:translate3d(-30px,30px,0) scale(.94)}
}

/* ذرات شناور */
.particle{
  position:absolute;width:3px;height:3px;border-radius:50%;
  box-shadow:0 0 8px currentColor;opacity:0;
  animation:particleFloat linear infinite;pointer-events:none;
}
@keyframes particleFloat{
  0%{transform:translateY(100vh) scale(0);opacity:0}
  10%{opacity:1}
  90%{opacity:1}
  100%{transform:translateY(-100px) scale(1);opacity:0}
}

/* ============ CARD ============ */
.card{
  position:relative;z-index:1;
  width:100%;max-width:480px;
  background:linear-gradient(160deg,rgba(20,29,51,.85),rgba(15,23,42,.95));
  border:1px solid rgba(120,150,200,.2);
  border-radius:28px;
  padding:44px 34px 34px;
  backdrop-filter:blur(30px) saturate(150%);
  -webkit-backdrop-filter:blur(30px) saturate(150%);
  box-shadow:
    0 50px 100px -30px rgba(0,0,0,.95),
    0 0 0 1px rgba(120,150,200,.06) inset,
    0 1px 0 rgba(255,255,255,.06) inset;
  text-align:center;
  animation:cardIn .8s cubic-bezier(.2,.9,.3,1.1) both;
  overflow:hidden;
}
@keyframes cardIn{
  from{opacity:0;transform:translateY(30px) scale(.94)}
  to{opacity:1;transform:none}
}
.card::before{
  content:'';position:absolute;
  top:0;left:0;right:0;height:4px;
  background:linear-gradient(90deg,#2ee6a6,#5b8cff,#c78aff,#ff5fa2);
  background-size:200% 100%;
  animation:barShimmer 4s linear infinite;
  border-radius:28px 28px 0 0;
}
@keyframes barShimmer{
  0%{background-position:0% 0}
  100%{background-position:200% 0}
}

/* ============ ICON ============ */
.icon-wrap{
  position:relative;
  display:inline-block;
  margin-bottom:24px;
}
.icon{
  position:relative;z-index:2;
  width:96px;height:96px;
  border-radius:28px;
  display:grid;place-items:center;
  font-size:46px;
  background:linear-gradient(135deg,rgba(46,230,166,.2),rgba(91,140,255,.2));
  border:1.5px solid rgba(46,230,166,.4);
  animation:iconBounce 3s ease-in-out infinite;
  box-shadow:
    0 20px 50px -15px rgba(46,230,166,.6),
    inset 0 -4px 8px rgba(0,0,0,.15),
    inset 0 4px 6px rgba(255,255,255,.2);
}
@keyframes iconBounce{
  0%,100%{transform:translateY(0)}
  50%{transform:translateY(-8px)}
}
.icon-wrap::before{
  content:'';position:absolute;
  inset:-14px;border-radius:50%;
  background:conic-gradient(from 0deg,
    transparent 0deg,
    #2ee6a6 90deg,
    transparent 180deg,
    #5b8cff 270deg,
    transparent 360deg);
  animation:spin 4s linear infinite;
  filter:blur(10px);
  opacity:.7;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* ============ TITLE ============ */
h1{
  font-size:24px;
  font-weight:900;
  margin-bottom:12px;
  line-height:1.35;
  background:linear-gradient(90deg,#eef3ff,#2ee6a6 60%,#5b8cff);
  background-size:200% auto;
  -webkit-background-clip:text;
  background-clip:text;
  -webkit-text-fill-color:transparent;
  animation:titleShine 4s linear infinite;
}
@keyframes titleShine{to{background-position:200% center}}

p{
  font-size:14px;
  color:#8697b8;
  line-height:1.85;
  margin-bottom:10px;
}

/* ============ EMAIL BOX ============ */
.email-box{
  display:inline-block;
  padding:10px 18px;
  border-radius:12px;
  background:rgba(46,230,166,.1);
  border:1px solid rgba(46,230,166,.3);
  color:#2ee6a6;
  font-family:'Menlo','Consolas',monospace;
  font-size:13px;
  margin:14px 0 24px;
  direction:ltr;
  word-break:break-all;
  max-width:100%;
  animation:emailPulse 2.5s ease-in-out infinite;
}
@keyframes emailPulse{
  0%,100%{box-shadow:0 0 0 0 rgba(46,230,166,.3)}
  50%{box-shadow:0 0 0 8px rgba(46,230,166,0)}
}

/* ============ STATUS ============ */
.status{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:14px 18px;
  border-radius:14px;
  font-size:13px;
  font-weight:700;
  margin-bottom:18px;
  animation:statusIn .5s ease;
  text-align:right;
}
.status.loading{
  background:rgba(91,140,255,.1);
  color:#93b2ff;
  border:1px solid rgba(91,140,255,.3);
}
.status.success{
  background:rgba(46,230,166,.1);
  color:#2ee6a6;
  border:1px solid rgba(46,230,166,.3);
}
.status.error{
  background:rgba(255,86,116,.1);
  color:#ff95a8;
  border:1px solid rgba(255,86,116,.3);
}
@keyframes statusIn{
  from{opacity:0;transform:translateY(-8px)}
  to{opacity:1;transform:none}
}
.spinner{
  width:16px;height:16px;
  border:2.5px solid rgba(91,140,255,.25);
  border-top-color:#93b2ff;
  border-radius:50%;
  animation:spin .7s linear infinite;
  flex-shrink:0;
}

/* ============ NAME FORM ============ */
.name-form{
  display:none;
  margin-top:24px;
  text-align:right;
  animation:fieldIn .5s ease;
}
.name-form.show{display:block}
@keyframes fieldIn{
  from{opacity:0;transform:translateY(10px)}
  to{opacity:1;transform:none}
}
.name-field{
  display:flex;
  flex-direction:column;
  gap:10px;
  margin-bottom:18px;
}
.name-field label{
  font-size:13px;
  font-weight:700;
  color:#c7d3ea;
  display:flex;
  align-items:center;
  gap:8px;
}
.name-input-wrap{
  position:relative;
  display:flex;
  align-items:center;
}
.name-input-wrap .ico{
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  font-size:16px;
  opacity:.55;
  pointer-events:none;
  background:none;
  border:none;
  width:auto;
  height:auto;
  box-shadow:none;
  animation:none;
}
input[type=text]{
  width:100%;
  background:rgba(255,255,255,.04);
  border:1.5px solid rgba(120,150,200,.2);
  color:#eef3ff;
  font:inherit;
  font-size:15px;
  padding:15px 46px;
  border-radius:14px;
  outline:none;
  transition:all .3s cubic-bezier(.2,.9,.3,1.05);
  font-family:inherit;
  text-align:right;
}
input[type=text]:focus{
  border-color:rgba(46,230,166,.7);
  background:rgba(46,230,166,.06);
  box-shadow:
    0 0 0 4px rgba(46,230,166,.15),
    0 0 30px -5px rgba(46,230,166,.6);
}
input[type=text].err{
  border-color:rgba(255,86,116,.6);
  background:rgba(255,86,116,.06);
  animation:shake .5s cubic-bezier(.36,.07,.19,.97) both;
}
@keyframes shake{
  10%,90%{transform:translateX(-2px)}
  20%,80%{transform:translateX(4px)}
  30%,50%,70%{transform:translateX(-6px)}
  40%,60%{transform:translateX(6px)}
}
input::placeholder{
  color:#6a7a95;
  opacity:.7;
}

/* ============ BUTTON ============ */
.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  gap:10px;
  padding:16px 28px;
  border-radius:15px;
  border:0;
  background:linear-gradient(135deg,#2ee6a6,#12b57f);
  color:#04170f;
  font:inherit;
  font-size:14.5px;
  font-weight:900;
  cursor:pointer;
  text-decoration:none;
  box-shadow:0 15px 40px -12px rgba(46,230,166,.7);
  transition:all .25s cubic-bezier(.2,.9,.3,1.1);
  width:100%;
  position:relative;
  overflow:hidden;
}
.btn::before{
  content:'';
  position:absolute;
  top:0;left:-100%;
  width:100%;height:100%;
  background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);
  transition:left .6s;
}
.btn:hover::before{left:100%}
.btn:hover{
  transform:translateY(-2px);
  box-shadow:0 22px 50px -12px rgba(46,230,166,.9);
}
.btn:active{transform:translateY(0) scale(.98)}
.btn:disabled{opacity:.7;cursor:not-allowed;transform:none}
.btn .spinner{
  width:16px;height:16px;
  border:2.5px solid rgba(4,23,15,.25);
  border-top-color:#04170f;
  border-radius:50%;
  animation:spin .7s linear infinite;
  display:none;
}
.btn.loading .spinner{display:block}
.btn.loading .lbl{opacity:.7}

/* ============ COUNTDOWN ============ */
.countdown{
  font-size:13px;
  color:#8697b8;
  margin-top:16px;
  text-align:center;
}
.countdown strong{
  color:#2ee6a6;
  font-size:18px;
  font-weight:900;
}

/* ============ SKIP LINK ============ */
.skip-link{
  display:inline-block;
  margin-top:14px;
  font-size:12.5px;
  color:#6a7a95;
  cursor:pointer;
  text-decoration:underline;
  background:none;
  border:0;
  font-family:inherit;
  transition:color .2s;
}
.skip-link:hover{color:#eef3ff}

/* ============ BACK BUTTON ============ */
.back-btn{
  display:none;
  margin-top:16px;
  padding:12px 24px;
  border-radius:12px;
  border:1.5px solid rgba(120,150,200,.25);
  background:rgba(120,150,200,.06);
  color:#c7d3ea;
  font:inherit;
  font-size:13px;
  font-weight:800;
  cursor:pointer;
  width:100%;
  transition:all .2s;
  font-family:inherit;
}
.back-btn.show{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.back-btn:hover{
  background:rgba(120,150,200,.15);
  border-color:rgba(120,150,200,.4);
  color:#eef3ff;
}

/* ============ RESPONSIVE ============ */
@media (max-width:480px){
  body{padding:14px}
  .card{padding:36px 22px 28px;border-radius:24px}
  .icon{width:80px;height:80px;font-size:38px;border-radius:22px}
  h1{font-size:21px}
  p{font-size:13px}
  input[type=text]{font-size:16px;padding:14px 44px}
  .btn{padding:15px;font-size:14px}
}

@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{
    animation-duration:.01ms !important;
    animation-iteration-count:1 !important;
    transition-duration:.01ms !important;
  }
}
</style>
</head>
<body>

<div class="bg" aria-hidden="true">
  <div class="orb orb-a"></div>
  <div class="orb orb-b"></div>
  <div class="orb orb-c"></div>
  <div class="orb orb-d"></div>
  <div id="particles"></div>
</div>

<div class="card">
  <div class="icon-wrap">
    <div class="icon" id="icon">📧</div>
  </div>

  <h1 id="title">در حال تأیید ایمیل…</h1>
  <p id="subtitle">لطفاً کمی صبر کن</p>
  <div class="email-box" id="emailBox" style="display:none"></div>

  <div class="status loading" id="status">
    <span class="spinner"></span>
    <span id="statusText">در حال بررسی لینک تأیید…</span>
  </div>

  <form class="name-form" id="nameForm">
    <div class="name-field">
      <label>👋 اسمت چیه؟</label>
      <div class="name-input-wrap">
        <span class="ico">✏️</span>
        <input type="text" id="nameInput" placeholder="مثلاً امیرحسین" required maxlength="40" autocomplete="name">
      </div>
      <p style="font-size:11.5px;color:#6a7a95;text-align:right;margin:0">این اسم توی پنل حساب کاربریت نشون داده می‌شه</p>
    </div>
    <button type="submit" class="btn" id="btnSave">
      <span class="spinner"></span>
      <span class="lbl">💾 ذخیره و ادامه</span>
    </button>
    <div style="text-align:center">
      <button type="button" class="skip-link" id="skipBtn">فعلاً رد کن ←</button>
    </div>
  </form>

  <div class="countdown" id="countdown" style="display:none">
    ورود خودکار در <strong id="sec">3</strong> ثانیه…
  </div>

  <button type="button" class="back-btn" id="backBtn" onclick="location.href='auth.html'">
    ← بازگشت به صفحه ورود
  </button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
(function(){
  'use strict';

  var SUPABASE_URL = 'https://rodguhcuatixdbzwjfvy.supabase.co';
  var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJvZGd1aGN1YXRpeGRiendqZnZ5Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODk5MTgyMTMsImV4cCI6MjEwNTQ5NDIxM30.oXGyCA3jOcsS5inqsXuSOhELZLoUG7pYagZox1SEmhY';
  var sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

  var NEXT_PAGE = 'welcome.html';   // بعد از تأیید → راهنمای کاربر جدید

  var $ = function(id){ return document.getElementById(id); };

  /* ============ Particles ============ */
  (function createParticles(){
    var wrap = $('particles');
    if (!wrap) return;
    var colors = ['#2ee6a6', '#5b8cff', '#ff5fa2', '#c78aff'];
    for (var i = 0; i < 25; i++) {
      var p = document.createElement('span');
      p.className = 'particle';
      p.style.left = (Math.random() * 100) + '%';
      p.style.color = colors[Math.floor(Math.random() * colors.length)];
      p.style.background = 'currentColor';
      p.style.animationDuration = (8 + Math.random() * 12) + 's';
      p.style.animationDelay = (-Math.random() * 20) + 's';
      p.style.width = p.style.height = (2 + Math.random() * 3) + 'px';
      wrap.appendChild(p);
    }
  })();

  /* ============ Status helper ============ */
  function setStatus(type, text, icon){
    var s = $('status');
    if (!s) return;
    s.className = 'status ' + type;
    $('statusText').textContent = text;
    if (icon) $('icon').textContent = icon;
  }
  function hideStatus(){
    var s = $('status');
    if (s) s.style.display = 'none';
  }

  /* ============ URL error check ============ */
  (function checkUrlError(){
    try {
      var hash = window.location.hash.substring(1);
      if (!hash) return;
      var params = new URLSearchParams(hash);
      if (params.get('error_code') === 'otp_expired') {
        setStatus('error', 'لینک تأیید منقضی شده. لطفاً دوباره ثبت‌نام کن.', '⏰');
        $('title').textContent = 'لینک منقضی شده';
        $('subtitle').textContent = 'این لینک قبلاً استفاده شده یا منقضی شده.';
        $('backBtn').classList.add('show');
        window.history.replaceState(null, '', window.location.pathname);
        return true;
      }
      if (params.get('error')) {
        setStatus('error', 'خطا در لینک تأیید', '❌');
        $('title').textContent = 'لینک نامعتبر';
        $('backBtn').classList.add('show');
        return true;
      }
    } catch(e) {}
    return false;
  })();

  /* ============ Init: بررسی session ============ */
  (async function init(){
    try {
      var res = await sb.auth.getSession();
      var session = res && res.data && res.data.session;

      if (session && session.user) {
        await handleConfirmed(session.user);
        return;
      }

      // چند بار چک کن — Supabase ممکنه دیر session بسازه
      var attempts = 0;
      var maxAttempts = 15;
      var checkInterval = setInterval(async function(){
        attempts++;
        try {
          var r = await sb.auth.getSession();
          if (r && r.data && r.data.session && r.data.session.user) {
            clearInterval(checkInterval);
            await handleConfirmed(r.data.session.user);
          } else if (attempts >= maxAttempts) {
            clearInterval(checkInterval);
            setStatus('error', 'ایمیل تأیید نشد. لطفاً دوباره از صفحه ورود تلاش کن.', '❌');
            $('title').textContent = 'تأیید ناموفق';
            $('subtitle').innerHTML = 'اگه ایمیل تأیید دریافت نکردی، از صفحه ورود دکمه «فراموشی رمز» رو بزن یا دوباره ثبت‌نام کن.';
            $('backBtn').classList.add('show');
          }
        } catch(e) {}
      }, 500);

    } catch (err) {
      console.error('[Confirm] Init error:', err);
      setStatus('error', 'خطا در تأیید ایمیل', '❌');
      $('backBtn').classList.add('show');
    }
  })();

  /* ============ Handle confirmed user ============ */
  async function handleConfirmed(user){
    $('title').textContent = '🎉 خوش آمدی!';
    $('subtitle').textContent = 'ایمیلت با موفقیت تأیید شد';
    $('emailBox').style.display = 'inline-block';
    $('emailBox').textContent = user.email || '';

    var metadata = user.user_metadata || {};
    var existingName = metadata.full_name || metadata.name || '';

    // اگه قبلاً اسم ذخیره شده → مستقیم برو
    if (existingName && existingName.trim()) {
      setStatus('success', 'خوش آمدی ' + existingName + '! در حال انتقال…', '✅');
      setTimeout(function(){
        window.location.href = NEXT_PAGE;
      }, 1200);
      return;
    }

    // فرم اسم رو نشون بده
    setStatus('success', 'برای ادامه اسمت رو وارد کن', '✨');
    $('nameForm').classList.add('show');
    setTimeout(function(){
      var inp = $('nameInput');
      if (inp) inp.focus();
    }, 400);
  }

  /* ============ Save name ============ */
  $('nameForm').addEventListener('submit', async function(e){
    e.preventDefault();
    var name = $('nameInput').value.trim();

    if (!name || name.length < 2) {
      var inp = $('nameInput');
      inp.classList.add('err');
      inp.focus();
      setTimeout(function(){ inp.classList.remove('err'); }, 1000);
      return;
    }

    var btn = $('btnSave');
    btn.classList.add('loading');
    btn.disabled = true;

    try {
      var result = await sb.auth.updateUser({
        data: { full_name: name }
      });

      if (result.error) throw result.error;

      setStatus('success', 'خوش آمدی ' + name + '! در حال انتقال…', '✅');
      $('nameForm').classList.remove('show');

      var sec = 2;
      $('countdown').style.display = 'block';
      $('sec').textContent = sec;

      var timer = setInterval(function(){
        sec--;
        $('sec').textContent = sec;
        if (sec <= 0) {
          clearInterval(timer);
          window.location.href = NEXT_PAGE;
        }
      }, 1000);

    } catch (err) {
      btn.classList.remove('loading');
      btn.disabled = false;
      setStatus('error', 'خطا در ذخیره اسم: ' + (err.message || 'نامشخص'), '❌');
    }
  });

  /* ============ Skip ============ */
  $('skipBtn').addEventListener('click', function(){
    window.location.href = NEXT_PAGE;
  });

})();
</script>
</body>
</html>
